# fly.toml app configuration file generated for peacehealthtracker on 2026-07-29T15:45:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'peacehealthtracker'
primary_region = 'iad'

[build]

[deploy]
  release_command = 'npx prisma migrate deploy'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
