# Fly.io app configuration. Create the app first with `fly apps create <name>`
# (or `fly launch --no-deploy` to generate this interactively), attach a
# Postgres instance with `fly postgres create` + `fly postgres attach`, then
# set the remaining secrets:
#
#   fly secrets set AUTH_SECRET=... ALLOWED_EMAIL=... \
#     AUTH_GOOGLE_ID=... AUTH_GOOGLE_SECRET=...
#
# `fly postgres attach` sets DATABASE_URL automatically.

app = "fitness-app" # change to your chosen app name
primary_region = "iad" # change to whichever region is closest to you

[build]

[deploy]
  release_command = "npx prisma migrate deploy"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
